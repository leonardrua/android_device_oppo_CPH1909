# mke2fs.conf for the recovery ramdisk.
#
# Read by mke2fs(8) when TWRP formats an ext4 filesystem on the device
# (Format Data, Format Cache, and the ext4 entries in twrp.fstab). Without
# it mke2fs falls back to its compiled-in defaults, which differ from the
# feature set the stock AOSP/MTK images were built with -- notably
# has_journal, extent, huge_file, dir_nlink, extra_isize and uninit_bg for
# ext4. A filesystem created without the journal and extent features is not
# always mountable by the stock bootloader, so the defaults matter here.
#
# This is the AOSP configuration shipped as /etc/mke2fs.conf in the stock
# recovery image; it is not device-specific to the CPH1909.
#
# Sections follow the libfstab syntax understood by mke2fs:
#   [defaults]  - global options
#   [fs_types]  - per-filesystem-type feature sets
#
# Every key in [defaults] below is honoured by mke2fs:
#   base_features       - features added to every filesystem
#   default_mntopts     - mount options recorded in the superblock
#   enable_periodic_fsck- whether the kernel runs fsck on mount
#   blocksize           - default block size
#   inode_size          - default inode size
#   inode_ratio         - bytes per inode
#   reserved_ratio      - percent of blocks reserved for root (1.0 here,
#                         against the e2fsprogs default of 5.0)
# The [fs_types] entries override those defaults per filesystem type.
#
# Note the difference from the build host's own /etc/mke2fs.conf: the host
# default enables 64bit, flex_bg and metadata_csum for ext4, this one does
# not, and it adds uninit_bg instead. Android 8.1-era tooling on this device
# is not guaranteed to handle a metadata_csum filesystem, so the stock feature
# set is the one to use.

[defaults]
    base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
    default_mntopts = acl,user_xattr
    enable_periodic_fsck = 0
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
    reserved_ratio = 1.0

[fs_types]
    ext3 = {
        features = has_journal
    }
    ext4 = {
        features = has_journal,extent,huge_file,dir_nlink,extra_isize,uninit_bg
        inode_size = 256
    }
    ext4dev = {
        features = has_journal,extent,huge_file,inline_data,dir_nlink,extra_isize
        inode_size = 256
        options = test_fs=1
    }
    small = {
        blocksize = 1024
        inode_size = 128
        inode_ratio = 4096
    }
    floppy = {
        blocksize = 1024
        inode_size = 128
        inode_ratio = 8192
    }
    big = {
        inode_ratio = 32768
    }
    huge = {
        inode_ratio = 65536
    }
    news = {
        inode_ratio = 4096
    }
    largefile = {
        inode_ratio = 1048576
        blocksize = -1
    }
    largefile4 = {
        inode_ratio = 4194304
        blocksize = -1
    }
    hurd = {
         blocksize = 4096
         inode_size = 128
    }
