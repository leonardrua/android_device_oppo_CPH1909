name: Device Tree CI

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Device Tree Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ELF utilities
        run: sudo apt-get update && sudo apt-get install -y binutils file

      - name: Validate PRODUCT_COPY_FILES & tree integrity
        run: |
          python3 - << 'EOF'
          import os, sys, re, subprocess

          print("=== Step 1: Checking PRODUCT_COPY_FILES exist on disk ===")
          device_mk = open("device.mk").read()
          copied = re.findall(r"\$\(DEVICE_PATH\)/([^\s:]+)", device_mk)
          missing = [f for f in copied if not os.path.exists(f)]
          if missing:
              print(f"FAILED: {len(missing)} files listed in device.mk do not exist:")
              for m in missing:
                  print("  -", m)
              sys.exit(1)
          print(f"SUCCESS: All {len(copied)} files in PRODUCT_COPY_FILES exist.")

          print("\n=== Step 1b: Every local PRODUCT_PACKAGES module must be defined ===")
          # A module named in PRODUCT_PACKAGES whose defining Android.mk is never
          # parsed is silently dropped: the build system only warns about an
          # unresolvable PRODUCT_PACKAGES entry in TARGET_BUILD_APPS (sdk) builds,
          # so a normal ROM build ships green with the module missing. That is how
          # power.mt6765 was lost -- power/Android.mk sat behind an Android.mk the
          # Soong finder had already matched (it stops descending on first hit).
          #
          # Soong's finder (finder.FindFirstNamedAt) yields exactly one Android.mk
          # per directory subtree; reproduce that here and require every
          # PRODUCT_PACKAGES name defined in a LOCAL_MODULE to be reachable from
          # one of the parsed makefiles, either directly or via all-makefiles-under.
          def find_first_named_at(root, name):
              out = []
              for cur, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in ('.git', '.repo', 'out')]
                  if name in files:
                      out.append(os.path.join(cur, name))
                      dirs[:] = []          # same stop-descending behaviour
              return out

          parsed = [p for p in find_first_named_at('.', 'Android.mk')]

          # Expand all-makefiles-under() includes from the parsed makefiles.
          reachable = set(parsed)
          changed = True
          while changed:
              changed = False
              for mk in list(reachable):
                  try:
                      text = open(mk).read()
                  except OSError:
                      continue
                  for m in re.finditer(r'all-makefiles-under\s*,\s*\$\(LOCAL_PATH\)', text):
                      base = os.path.dirname(mk)
                      for sub in sorted(os.listdir(base) if os.path.isdir(base) else []):
                          cand = os.path.join(base, sub, 'Android.mk')
                          if os.path.isfile(cand) and cand not in reachable:
                              reachable.add(cand)
                              changed = True

          # Module names defined anywhere in the tree.
          defined = {}
          for cur, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'out')]
              for f in files:
                  if not f.endswith(('.mk', '.bp')):
                      continue
                  path = os.path.join(cur, f)
                  try:
                      text = open(path, errors='replace').read()
                  except OSError:
                      continue
                  for name in re.findall(r'^\s*LOCAL_MODULE\s*:=\s*(\S+)', text, re.M):
                      defined.setdefault(name, path)
                  for name in re.findall(r'^\s*name:\s*"([^"]+)"', text, re.M):
                      defined.setdefault(name, path)

          # PRODUCT_PACKAGES names requested by this product.
          def parse_product_packages(path):
              """Line-based: handles '\\'-continued lists; skips $(VAR) refs."""
              try:
                  lines = open(path, errors='replace').read().splitlines()
              except OSError:
                  return []
              out, collecting = [], False
              for raw in lines:
                  line = raw.strip()
                  first = re.match(r'^PRODUCT_PACKAGES\s*\+?=', line)
                  if not collecting and not first:
                      continue
                  collecting = True
                  if first:
                      line = re.sub(r'^PRODUCT_PACKAGES\s*\+?=\s*', '', line)
                  cont = line.endswith('\\')
                  token = line.rstrip('\\').strip()
                  if token and not token.startswith('#') and '$(' not in token:
                      out.append(token)
                  if not cont:
                      collecting = False
              return out

          requested = []
          for mk in ['device.mk', 'lineage_CPH1909.mk']:
              requested += parse_product_packages(mk)

          # Only Android.mk-defined modules are at risk: Soong discovers
          # Android.bp with FindNamedAt (which searches every directory), but
          # Android.mk with FindFirstNamedAt (which stops descending on the
          # first hit). So scope this check to modules defined in .mk files.
          all_under = re.search(r'all-makefiles-under\s*,\s*\$\(LOCAL_PATH\)',
                                open('Android.mk').read())
          local = sorted({m for m in requested
                          if m in defined and defined[m].endswith(".mk")})
          if all_under:
              # An all-makefiles-under() include picks up every subdirectory
              # Android.mk, so nothing local can be orphaned.
              orphan = []
          else:
              orphan = [m for m in local if defined[m] != './Android.mk']
          if orphan:
              print(f"FAILED: {len(orphan)} local PRODUCT_PACKAGES module(s) are defined in")
              print("an Android.mk that the build will never parse:")
              for m in orphan:
                  print(f"  - {m}  (defined in {defined[m]})")
              print("Add include $(call all-makefiles-under,$(LOCAL_PATH)) to Android.mk,")
              print("or reference the subdirectory makefile explicitly.")
              sys.exit(1)
          print(f"SUCCESS: All {len(local)} Make-defined PRODUCT_PACKAGES modules are reachable.")

          print("\n=== Step 2: Checking kernel configuration ===")
          board = open("BoardConfig.mk").read()
          kconfig = re.search(r"^TARGET_KERNEL_CONFIG := (\S+)", board, re.M)
          ksource = re.search(r"^TARGET_KERNEL_SOURCE := (\S+)", board, re.M)
          karch = re.search(r"^TARGET_KERNEL_ARCH := (\S+)", board, re.M)
          kimage = re.search(r"^BOARD_KERNEL_IMAGE_NAME := (\S+)", board, re.M)
          prebuilt_var = re.search(r"^TARGET_(FORCE_)?PREBUILT_KERNEL\s*:=", board, re.M)
          if prebuilt_var:
              print("FAILED: TARGET_PREBUILT_KERNEL is set -- this tree builds the kernel "
                    "from TARGET_KERNEL_SOURCE and carries no prebuilt image.")
              sys.exit(1)
          leftover = [p for p in ("prebuilt/Image.gz-dtb", "prebuilt/Image", "prebuilt/kernel")
                      if os.path.exists(p)]
          if leftover:
              print(f"FAILED: prebuilt kernel image still present: {leftover}. "
                    "Remove it; the kernel is built from source.")
              sys.exit(1)
          if not (kconfig and ksource and karch and kimage):
              print("FAILED: TARGET_KERNEL_SOURCE, TARGET_KERNEL_CONFIG, TARGET_KERNEL_ARCH and "
                    "BOARD_KERNEL_IMAGE_NAME must all be set so the kernel is built from the "
                    "checked-out source tree.")
              sys.exit(1)
          print(f"SUCCESS: kernel built from source: {ksource.group(1)} "
                f"({kconfig.group(1)}, {karch.group(1)}, {kimage.group(1)}).")

          print("\n=== Step 3: Checking fstab configuration ===")
          fstab_paths = ["rootdir/etc/fstab.mt6765", "recovery/root/etc/twrp.fstab"]
          found_fstab = False
          for fpath in fstab_paths:
              if os.path.exists(fpath):
                  found_fstab = True
                  fstab = open(fpath).read()
                  required_mounts = ["/system", "/vendor", "/data", "/boot", "/recovery"]
                  missing_mounts = [m for m in required_mounts if m not in fstab]
                  if missing_mounts:
                      print(f"FAILED: {fpath} missing critical mounts: {missing_mounts}")
                      sys.exit(1)
                  print(f"SUCCESS: {fpath} contains all critical mount points.")
          if not found_fstab:
              print("FAILED: No valid fstab file found.")
              sys.exit(1)

          print("\n=== Step 4: Checking ELF binary dependencies (if present) ===")
          if os.path.exists("recovery/root"):
              local_libs = {f for root, dirs, files in os.walk("recovery/root") for f in files if f.endswith(".so")}
              # Core Android & TWRP platform libraries provided at build time by minimal-manifest-twrp
              twrp_platform_libs = {
                  "android.hardware.gatekeeper@1.0.so",
                  "android.hardware.keymaster@3.0.so",
                  "android.hardware.weaver@1.0.so",
                  "android.hidl.token@1.0.so",
                  "android.system.wifi.keystore@1.0.so",
                  "libaosprecovery.so",
                  "libbacktrace.so",
                  "libbase.so",
                  "libbinder.so",
                  "libblkid.so",
                  "libbmlutils.so",
                  "libbootloader_message_twrp.so",
                  "libc++.so",
                  "libc.so",
                  "libcap.so",
                  "libcrecovery.so",
                  "libcryptfsfde.so",
                  "libcrypto.so",
                  "libcrypto_utils.so",
                  "libcutils.so",
                  "libdl.so",
                  "libe4crypt.so",
                  "libexfat_twrp.so",
                  "libext2_blkid.so",
                  "libext2_com_err.so",
                  "libext2_e2p.so",
                  "libext2_misc.so",
                  "libext2_profile.so",
                  "libext2_quota.so",
                  "libext2_uuid.so",
                  "libext2fs.so",
                  "libext4_utils.so",
                  "libflashutils.so",
                  "libft2.so",
                  "libfusesideload.so",
                  "libgatekeeper.so",
                  "libgpt_twrp.so",
                  "libhardware.so",
                  "libhardware_legacy.so",
                  "libhidl-gen-utils.so",
                  "libhidlbase.so",
                  "libhidltransport.so",
                  "libhwbinder.so",
                  "libkeymaster_messages.so",
                  "libkeymaster_portable.so",
                  "libkeymaster_staging.so",
                  "libkeystore_binder.so",
                  "libkeyutils.so",
                  "liblog.so",
                  "liblogcat.so",
                  "liblzma.so",
                  "libm.so",
                  "libminadbd.so",
                  "libminuitwrp.so",
                  "libminzip.so",
                  "libmmcutils.so",
                  "libmtdutils.so",
                  "libncurses.so",
                  "libnetd_client.so",
                  "libnl.so",
                  "libopenaes.so",
                  "libpackagelistparser.so",
                  "libpcre2.so",
                  "libpcrecpp.so",
                  "libpng.so",
                  "libprotobuf-cpp-lite.so",
                  "libselinux.so",
                  "libsoftkeymaster.so",
                  "libsoftkeymasterdevice.so",
                  "libsparse.so",
                  "libssh.so",
                  "libssl.so",
                  "libstdc++.so",
                  "libsysutils.so",
                  "libtar.so",
                  "libtinyxml2.so",
                  "libtwadbbu.so",
                  "libtwrpdigest.so",
                  "libtwrpmtp-legacy.so",
                  "libunwind.so",
                  "libusbhost.so",
                  "libutil-linux.so",
                  "libutils.so",
                  "libvintf.so",
                  "libvndksupport.so",
                  "libwifikeystorehal.so",
                  "libz.so",
                  "libziparchive.so",
              }
              all_known = local_libs | twrp_platform_libs

              elfs = []
              for root, dirs, files in os.walk("recovery/root"):
                  for f in files:
                      p = os.path.join(root, f)
                      try:
                          out = subprocess.check_output(["file", p]).decode()
                          if "ELF" in out:
                              elfs.append(p)
                      except:
                          pass

              unresolved = {}
              for elf in elfs:
                  out = subprocess.check_output(["readelf", "-d", elf], stderr=subprocess.DEVNULL).decode()
                  deps = re.findall(r"\(NEEDED\)\s+Shared library:\s+\[(.*?)\]", out)
                  for d in deps:
                      if d not in all_known:
                          unresolved.setdefault(elf, []).append(d)

              if unresolved:
                  print(f"FAILED: Unresolved library dependencies detected: {unresolved}")
                  sys.exit(1)
              print(f"SUCCESS: All {len(elfs)} ELF binaries/libraries have dependencies accounted for.")
          else:
              print("SUCCESS: Standalone AOSP device tree layout (no recovery/root directory).")

          print("\n=== Step 5: Checking platform and device configuration ===")
          platform_match = re.search(r"^PLATFORM_VERSION := (\S+)", board, re.M)
          if platform_match:
              platform = platform_match.group(1)
              if os.path.exists(".github/workflows/recovery-build.yml"):
                  workflow = open(".github/workflows/recovery-build.yml").read()
                  branch = re.search(r"MANIFEST_BRANCH:[\s\S]*?default:\s*'([^']+)'", workflow).group(1)
                  expected = {"twrp-8.1": "8.1.0", "twrp-9.0": "9.0.0", "twrp-10.0": "10.0.0"}
                  if branch in expected and expected[branch] != platform:
                      print(f"FAILED: manifest branch '{branch}' expects PLATFORM_VERSION {expected[branch]}, BoardConfig.mk says {platform}")
                      sys.exit(1)
              print(f"SUCCESS: PLATFORM_VERSION {platform} validated.")
          else:
              target_device = re.search(r"^TARGET_OTA_ASSERT_DEVICE := (\S+)", board, re.M)
              if not target_device or target_device.group(1) != "CPH1909":
                  print("FAILED: Invalid TARGET_OTA_ASSERT_DEVICE in BoardConfig.mk")
                  sys.exit(1)
              print(f"SUCCESS: AOSP device profile verified for target {target_device.group(1)}.")

          print("\n=== Step 6: Validating XML file integrity ===")
          import glob
          import xml.etree.ElementTree as ET
          xml_files = glob.glob("**/*.xml", recursive=True)
          for xf in xml_files:
              try:
                  ET.parse(xf)
              except Exception as e:
                  print(f"FAILED: XML parse error in {xf}: {e}")
                  sys.exit(1)
          print(f"SUCCESS: All {len(xml_files)} XML files are well-formed.")

          print("\n=== Step 7: Checking SELinux policy files ===")
          for se_file in ["sepolicy/vendor/file_contexts", "sepolicy/vendor/device.te"]:
              if not os.path.exists(se_file):
                  print(f"FAILED: Missing SELinux file: {se_file}")
                  sys.exit(1)
              with open(se_file, "rb") as fp:
                  content = fp.read()
                  if not content.endswith(b"\n"):
                      print(f"FAILED: {se_file} does not end with a newline.")
                      sys.exit(1)
          print("SUCCESS: SELinux policy files present and properly terminated.")

          print("\n=== Step 8: Validating proprietary files list ===")
          prop_path = "proprietary-files.txt"
          if not os.path.exists(prop_path):
              print("FAILED: proprietary-files.txt is missing.")
              sys.exit(1)
          forbidden = ["vendor/manifest.xml", "vendor/compatibility_matrix.xml", "vendor/etc/selinux/"]
          with open(prop_path) as fp:
              for line in fp:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  clean = line.lstrip("-").split("|")[0].split(":")[0]
                  for forb in forbidden:
                      if clean.startswith(forb):
                          print(f"FAILED: Forbidden file in proprietary-files.txt: {clean}")
                          sys.exit(1)
          print("SUCCESS: proprietary-files.txt passed validation.")

          print("\n=== All validation checks passed successfully! ===")
          EOF
