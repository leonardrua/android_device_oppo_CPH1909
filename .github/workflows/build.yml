name: Build LineageOS 17.1 (Oppo A5s CPH1909) - Namespace

on:
  workflow_dispatch:
    inputs:
      device_repo:
        description: 'Device tree repo (user/repo)'
        required: true
        default: 'leonardrua/android_device_oppo_CPH1909'
      device_branch:
        description: 'Device tree branch'
        required: true
        default: 'main'
      vendor_repo:
        description: 'Vendor repo'
        required: true
        default: 'leonardrua/android_vendor_oppo_CPH1909'
      vendor_branch:
        description: 'Vendor branch'
        required: true
        default: 'main'
      device_name:
        description: 'Device codename'
        required: true
        default: 'CPH1909'
      target:
        description: 'Build target'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bootimage
          - vendorimage
          - productimage
          - systemimage
          - bacon
      build_type:
        description: 'Build type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - eng
          - user
      build_timeout_min:
        description: 'Build timeout in minutes'
        required: true
        default: '600'
      out_on_cache:
        description: 'Keep ccache and the out directory on the persistent /cache disk'
        required: true
        type: boolean
        default: true
      clean_out:
        description: 'Delete the old out directory before building'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: namespace-profile-leonard
    timeout-minutes: 720
    env:
      TOKEN: ${{ secrets.GH_PAT || github.token }}
      IN_DEVICE_REPO: ${{ inputs.device_repo }}
      IN_DEVICE_BRANCH: ${{ inputs.device_branch }}
      IN_VENDOR_REPO: ${{ inputs.vendor_repo }}
      IN_VENDOR_BRANCH: ${{ inputs.vendor_branch }}
      DEVICE: ${{ inputs.device_name }}
      TARGET: ${{ inputs.target }}
      BTYPE: ${{ inputs.build_type }}
      BUILD_TIMEOUT_MIN: ${{ inputs.build_timeout_min }}
      OUT_ON_CACHE: ${{ inputs.out_on_cache }}
      CLEAN_OUT: ${{ inputs.clean_out }}
      CCACHE_SIZE: 10G

    steps:
      # ------------------------------------------------------------ setup --
      - name: Runner info
        run: |
          head -2 /etc/os-release
          echo "Cores: $(nproc --all)"
          free -h
          df -h / /cache 2>/dev/null || df -h "$GITHUB_WORKSPACE"

      - name: Set up Python 2 for legacy kernel tools
        run: |
          curl -fL --retry 2 \
            https://github.com/NCLnclNCL/kernel-build/releases/download/python2.7.18/python2.7.18.zip \
            -o "$RUNNER_TEMP/python2.7.18.zip"
          unzip -q "$RUNNER_TEMP/python2.7.18.zip" -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/python2-shim"
          cat > "$RUNNER_TEMP/python2-shim/python" <<'EOF'
          #!/bin/sh
          export PYTHONHOME="$RUNNER_TEMP/python2"
          exec "$PYTHONHOME/bin/python" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/python2-shim/python"
          sudo ln -sf "$RUNNER_TEMP/python2-shim/python" /usr/bin/python
          echo "$RUNNER_TEMP/python2-shim" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python2-shim/python" -c 'import sys; print(sys.version)'

      - name: Prepare cache dirs
        run: |
          if [ "$OUT_ON_CACHE" = "true" ] && [ -d /cache ]; then
            sudo mkdir -p /cache/ccache /cache/out
            sudo chown -R "$(id -u):$(id -g)" /cache/ccache /cache/out
            if [ "$CLEAN_OUT" = "true" ]; then rm -rf /cache/out/*; fi
            echo "CCACHE_DIR=/cache/ccache" >> "$GITHUB_ENV"
            echo "OUT_BASE=/cache/out" >> "$GITHUB_ENV"
            echo "OUT_DIR=/cache/out" >> "$GITHUB_ENV"
            echo "Using /cache for ccache and out"
          else
            mkdir -p "$GITHUB_WORKSPACE/.ccache"
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
            echo "OUT_BASE=$GITHUB_WORKSPACE/lineage/out" >> "$GITHUB_ENV"
            echo "Using the root disk for ccache and out"
          fi

      - name: Normalize repo names
        run: |
          norm() {
            local t="$1"
            t="${t#https://github.com/}"
            t="${t#http://github.com/}"
            t="${t%.git}"
            echo "${t%/}"
          }
          echo "DEVICE_REPO=$(norm "$IN_DEVICE_REPO")" >> "$GITHUB_ENV"
          echo "VENDOR_REPO=$(norm "$IN_VENDOR_REPO")" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 unzip"
          AVAIL=""
          for p in $PKGS; do
            if apt-cache policy "$p" 2>/dev/null | grep -q 'Candidate: [^(]'; then
              AVAIL="$AVAIL $p"
            else
              echo "Not available (skipping): $p"
            fi
          done
          sudo apt-get install -y $AVAIL

          # libncurses5 / libtinfo5 are missing from Ubuntu 24.04; fetch them from 22.04
          if ! dpkg -s libtinfo5 >/dev/null 2>&1; then
            echo "deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu jammy main universe" \
              | sudo tee /etc/apt/sources.list.d/jammy-tmp.list >/dev/null
            sudo apt-get update \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/jammy-tmp.list \
              -o Dir::Etc::sourceparts="-" \
              -o APT::Get::List-Cleanup=0 || true
            (cd /tmp && apt-get download libtinfo5 libncurses5) || echo "Could not download libncurses5"
            sudo dpkg -i /tmp/libtinfo5_*.deb /tmp/libncurses5_*.deb || echo "Could not install libncurses5"
            sudo rm -f /etc/apt/sources.list.d/jammy-tmp.list
            sudo apt-get update || true
          fi
          dpkg -s libncurses5 libtinfo5 2>/dev/null | grep -E '^(Package|Status)' || true

          mkdir -p ~/bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@users.noreply.github.com"
          git config --global color.ui false
          git config --global gc.auto 0

      - name: Validate inputs
        run: |
          case "$BUILD_TIMEOUT_MIN" in
            ''|*[!0-9]*) echo "::error::build_timeout_min must be a whole number of minutes"; exit 1 ;;
          esac
          git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/${DEVICE_REPO}.git" "$IN_DEVICE_BRANCH" >/dev/null \
            || { echo "::error::Device repo or branch not found: ${DEVICE_REPO} @ ${IN_DEVICE_BRANCH}"; exit 1; }
          git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/${VENDOR_REPO}.git" "$IN_VENDOR_BRANCH" >/dev/null \
            || { echo "::error::Vendor repo or branch not found: ${VENDOR_REPO} @ ${IN_VENDOR_BRANCH}"; exit 1; }
          echo "Inputs look good"

      # ----------------------------------------------------------- sources --
      - name: Sync LineageOS 17.1 source
        run: |
          mkdir -p lineage && cd lineage
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 \
            -g default,-darwin --depth=1 --no-clone-bundle

          ( while true; do
              echo "[monitor] $(date +%H:%M) disk: $(df -h . | tail -1 | awk '{print $3" used, "$4" free"}') | mem: $(free -m | awk '/Mem:/{print $3"MB used, "$7"MB avail"}')"
              sleep 180
            done ) &
          MON=$!

          ok=0
          for i in 1 2 3 4; do
            if ~/bin/repo sync -c -j4 -q --force-sync --no-clone-bundle --no-tags --optimized-fetch; then
              ok=1
              break
            fi
            echo "Retrying sync ($i)"
            sleep 15
          done
          kill $MON 2>/dev/null || true
          [ "$ok" = "1" ] || { echo "::error::Source sync failed"; exit 1; }
          df -h .

      - name: Add device and vendor trees
        working-directory: ${{ github.workspace }}/lineage
        run: |
          mkdir -p device/oppo vendor/oppo
          git clone --depth=1 -b "$IN_DEVICE_BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${DEVICE_REPO}.git" "device/oppo/${DEVICE}"
          git clone --depth=1 -b "$IN_VENDOR_BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${VENDOR_REPO}.git" "vendor/oppo/${DEVICE}"
          rm -rf "device/oppo/${DEVICE}/.git" "vendor/oppo/${DEVICE}/.git"
          ls -la "device/oppo/${DEVICE}" | head -60
          ls "vendor/oppo/${DEVICE}" | head -40
          if [ ! -f "device/oppo/${DEVICE}/lineage_${DEVICE}.mk" ]; then
            echo "::warning::lineage_${DEVICE}.mk not found in the device tree; lunch may fail"
          fi

      # The kernel image itself is prebuilt, but the LineageOS Soong module
      # generated_kernel_includes runs `make -C $(TARGET_KERNEL_SOURCE)
      # headers_install` for modules that depend on generated_kernel_headers.
      # TARGET_KERNEL_SOURCE (kernel/oppo/CPH1909) must therefore point at a
      # real, synced kernel source tree, so clone it here.
      - name: Add kernel source tree
        working-directory: ${{ github.workspace }}/lineage
        run: |
          mkdir -p kernel/oppo
          git clone --depth=1 -b lineageos-no-bakasu-susfs \
            "https://x-access-token:${TOKEN}@github.com/leonardrua/A5S-8.1-kernel-source.git" "kernel/oppo/${DEVICE}"
          rm -rf "kernel/oppo/${DEVICE}/.git"
          ls "kernel/oppo/${DEVICE}" | head

      - name: Guard AArch64 signal context header for ARM builds
        working-directory: ${{ github.workspace }}/lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("kernel/oppo/${{ inputs.device_name }}/arch/arm64/include/uapi/asm/sigcontext.h")
          contents = header.read_text()
          start_marker = "struct fpsimd_context {"
          end_marker = "\n};\n\n/* ESR_EL1 context */"
          if contents.count(start_marker) != 1 or contents.count(end_marker) != 1:
              raise SystemExit("Could not locate fpsimd_context in the AArch64 UAPI header")
          start = contents.index(start_marker)
          end = contents.index(end_marker, start) + len("\n};")
          guarded = "#ifdef __aarch64__\n" + contents[start:end] + "\n#endif"
          header.write_text(contents[:start] + guarded + contents[end:])
          PY

      - name: Keep kernel warnings non-fatal
        working-directory: ${{ github.workspace }}/lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("kernel/oppo/${{ inputs.device_name }}/scripts/Makefile.lib")
          contents = makefile.read_text()
          original = "$(ccflags-y) $(CFLAGS_$(basetarget).o)"
          if contents.count(original) != 1:
              raise SystemExit("Could not locate the expected Kbuild C flags in scripts/Makefile.lib")
          makefile.write_text(contents.replace(original, original + " -Wno-error", 1))
          PY

      - name: Add AArch64 GCC toolchain
        working-directory: ${{ github.workspace }}/lineage
        run: |
          TOOLCHAIN_DIR=prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05
          git clone --depth=1 --branch Linaro_6.3.1 \
            https://github.com/Nickdv9/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.git "$TOOLCHAIN_DIR"
          test -x "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc"
          "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc" --version | head -1
          rm -rf "$TOOLCHAIN_DIR/.git"

      # ------------------------------------------------------------- build --
      - name: Build
        working-directory: ${{ github.workspace }}/lineage
        run: |
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(which ccache)"
          export ALLOW_MISSING_DEPENDENCIES=true
          export PATH="$HOME/bin:$PATH"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_SIZE"

          CORES=$(nproc --all)
          MEM_GB=$(free -g | awk '/Mem:/{print $2}')
          SWAP_MB=$(free -m | awk '/Swap:/{print $2}')

          # Add zram swap on memory-constrained runners. Metalava/hiddenapi-lists-docs
          # and other Java doc/stub steps can spike memory and get OOM-killed even
          # when ninja parallelism looks reasonable. Fall back to a swapfile when
          # zram is unavailable. On containerized runners, swapon may be blocked;
          # in that case we keep parallelism very low.
          if [ "${SWAP_MB:-0}" -lt 8192 ]; then
            SWAP_ENABLED=false
            if sudo modprobe zram 2>/dev/null && [ -e /sys/block/zram0 ]; then
              sudo swapoff /dev/zram0 2>/dev/null || true
              echo 1 | sudo tee /sys/block/zram0/reset >/dev/null 2>&1 || true
              # Prefer a fast compressor when available.
              if [ -w /sys/block/zram0/comp_algorithm ] && grep -qw lz4 /sys/block/zram0/comp_algorithm 2>/dev/null; then
                echo lz4 | sudo tee /sys/block/zram0/comp_algorithm >/dev/null || true
              elif [ -w /sys/block/zram0/comp_algorithm ] && grep -qw zstd /sys/block/zram0/comp_algorithm 2>/dev/null; then
                echo zstd | sudo tee /sys/block/zram0/comp_algorithm >/dev/null || true
              fi
              echo 12G | sudo tee /sys/block/zram0/disksize >/dev/null
              sudo mkswap /dev/zram0 >/dev/null
              if sudo swapon -p 100 /dev/zram0 2>/dev/null; then
                echo "Enabled 12G zram swap on /dev/zram0"
                SWAP_ENABLED=true
              else
                echo "zram configured but swapon failed (likely blocked by runner)"
              fi
            else
              echo "zram unavailable; swapon is often blocked on this runner, skipping swapfile creation"
              SWAP_FILE="${SWAP_FILE:-/cache/swapfile}"
              if [ -f "$SWAP_FILE" ]; then
                sudo chmod 600 "$SWAP_FILE" 2>/dev/null || true
                if sudo swapon "$SWAP_FILE" 2>/dev/null; then
                  echo "Reused swapfile at $SWAP_FILE"
                  SWAP_ENABLED=true
                else
                  echo "Existing swapfile at $SWAP_FILE could not be activated"
                fi
              fi
            fi
            SWAP_MB=$(free -m | awk '/Swap:/{print $2}')
            if [ "$SWAP_ENABLED" != "true" ] && [ "${SWAP_MB:-0}" -lt 1024 ]; then
              echo "No swap could be activated; build will use reduced parallelism"
            fi
          fi

          # Leave headroom for large single-process Java/Metalava steps.
          # Container/Namespace runners often block swapon and may clear /cache
          # between runs, so use a faster in-job attempt first and retry remaining
          # work with -j1 if an OOM-like kill is detected.
          if [ "${MEM_GB:-0}" -le 8 ]; then
            JOBS=2
          elif [ "${SWAP_MB:-0}" -lt 1024 ]; then
            JOBS=3
          elif [ "${SWAP_MB:-0}" -lt 4096 ]; then
            JOBS=$(( MEM_GB / 4 ))
          else
            JOBS=$(( MEM_GB / 3 ))
          fi
          [ "$JOBS" -gt "$CORES" ] && JOBS=$CORES
          [ "$JOBS" -gt 6 ] && JOBS=6
          [ "$JOBS" -lt 2 ] && JOBS=2
          export JOBS

          echo "cores=$CORES mem=${MEM_GB}GB swap=${SWAP_MB}MB JOBS=$JOBS"
          echo "OUT_DIR=${OUT_DIR:-default}"
          free -h

          cat > "${GITHUB_WORKSPACE}/do_build.sh" <<'EOS'
          set -o pipefail
          source build/envsetup.sh
          lunch "lineage_${DEVICE}-${BTYPE}" || exit 1
          mka "${TARGET}" -j"${JOBS}"
          EOS

          run_build() {
            timeout "${BUILD_TIMEOUT_MIN}m" bash "${GITHUB_WORKSPACE}/do_build.sh" 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
            return ${PIPESTATUS[0]}
          }

          ( while true; do
              echo "[monitor] $(date +%H:%M) disk: $(df -h . | tail -1 | awk '{print $4" free"}') | mem: $(free -m | awk '/Mem:/{print $3"MB used, "$7"MB avail"}') | swap: $(free -m | awk '/Swap:/{print $3"MB used"}')"
              ps -eo pid,pcpu,pmem,rss,comm --sort=-rss | head -5
              sleep 180
            done ) &
          MON=$!

          set +e
          run_build
          RC=$?
          if [ "$RC" -ne 0 ] && grep -Eq '(^|[[:space:]])Killed([[:space:]]|$)|Out of memory|OOM killer|oom-kill' "${GITHUB_WORKSPACE}/build.log" 2>/dev/null; then
            cp -f "${GITHUB_WORKSPACE}/build.log" "${GITHUB_WORKSPACE}/build-attempt1-oom.log" 2>/dev/null || true
            echo "OOM-like failure detected (rc=$RC). Retrying remaining targets with JOBS=1 to avoid kernel OOM without slowing the normal path."
            export JOBS=1
            echo "Retry: JOBS=$JOBS OUT_DIR=${OUT_DIR:-default}"
            run_build
            RC=$?
          fi
          kill $MON 2>/dev/null || true
          echo "BUILD_RC=$RC" >> "$GITHUB_ENV"
          echo "Build finished with code: $RC (124 = timed out; 137/143 often indicate a killed process)"
          ccache -s | head -15
          exit 0

      # ----------------------------------------------------------- results --
      - name: Diagnostics on failure
        if: failure()
        run: |
          df -h || true
          free -h || true
          echo "=== possible OOM kills ==="
          sudo dmesg -T | grep -Ei 'killed process|out of memory|oom-kill|invoked oom-killer' | tail -n 40 || true
          echo "=== recent kernel messages ==="
          sudo dmesg -T | tail -n 40 || true

      - name: Collect output
        if: always()
        run: |
          OUT="${OUT_BASE}/target/product/${DEVICE}"
          RESULT="${GITHUB_WORKSPACE}/result"
          mkdir -p "$RESULT"
          if [ -d "$OUT" ]; then
            for f in "$OUT"/{boot,recovery,dtbo,vbmeta,system,vendor,product}.img \
                     "$OUT"/lineage-*.zip "$OUT"/lineage-*.zip.sha256sum; do
              if [ -f "$f" ]; then cp -v "$f" "$RESULT/"; fi
            done
          fi
          cp -v "${OUT_BASE}/error.log" "$RESULT/" 2>/dev/null || true
          cp -v "${GITHUB_WORKSPACE}/build-attempt1-oom.log" "$RESULT/" 2>/dev/null || true
          tail -n 3000 "${GITHUB_WORKSPACE}/build.log" > "$RESULT/build-tail.log" 2>/dev/null || true
          ls -lh "$RESULT"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-17.1-${{ inputs.device_name }}-${{ inputs.target }}
          path: ${{ github.workspace }}/result
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if build failed
        if: env.BUILD_RC != '0'
        run: |
          echo "::error::Build failed or timed out (code $BUILD_RC). See build-tail.log and error.log in the artifact."
          exit 1
