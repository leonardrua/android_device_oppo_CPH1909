name: Build LineageOS 17.1 (Oppo A5s CPH1909) - Namespace

run-name: Build lineage_${{ inputs.device_name }}-${{ inputs.build_type }} (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      device_repo:
        description: 'Device tree repo (user/repo)'
        required: true
        default: 'leonardrua/android_device_oppo_CPH1909'
      device_branch:
        description: 'Device tree branch'
        required: true
        default: 'main'
      vendor_repo:
        description: 'Vendor repo'
        required: true
        default: 'leonardrua/android_vendor_oppo_CPH1909'
      vendor_branch:
        description: 'Vendor branch'
        required: true
        default: 'main'
      device_name:
        description: 'Device codename'
        required: true
        default: 'CPH1909'
      target:
        description: 'Build target'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bootimage
          - vendorimage
          - productimage
          - systemimage
          - bacon
      build_type:
        description: 'Build type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - eng
          - user
      build_timeout_min:
        description: 'Build timeout in minutes'
        required: true
        default: '600'
      out_on_cache:
        description: 'Keep ccache and the out directory on the persistent /cache disk'
        required: true
        type: boolean
        default: true
      clean_out:
        description: 'Delete the old out directory before building'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# ccache and out/ live on a persistent disk that only one build can use safely.
concurrency:
  group: lineage-17.1-${{ inputs.device_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: namespace-profile-leonard
    timeout-minutes: 720
    env:
      # Workflow inputs. Scripts read these from the environment and never
      # have ${{ }} expressions interpolated into them.
      TOKEN: ${{ secrets.GH_PAT || github.token }}
      IN_DEVICE_REPO: ${{ inputs.device_repo }}
      IN_DEVICE_BRANCH: ${{ inputs.device_branch }}
      IN_VENDOR_REPO: ${{ inputs.vendor_repo }}
      IN_VENDOR_BRANCH: ${{ inputs.vendor_branch }}
      DEVICE: ${{ inputs.device_name }}
      TARGET: ${{ inputs.target }}
      BTYPE: ${{ inputs.build_type }}
      BUILD_TIMEOUT_MIN: ${{ inputs.build_timeout_min }}
      OUT_ON_CACHE: ${{ inputs.out_on_cache }}
      CLEAN_OUT: ${{ inputs.clean_out }}

      # Layout.
      SRC_DIR: ${{ github.workspace }}/lineage
      RESULT_DIR: ${{ github.workspace }}/result

      # Fixed sources.
      LINEAGE_MANIFEST_URL: https://github.com/LineageOS/android.git
      LINEAGE_BRANCH: lineage-17.1
      KERNEL_REPO: leonardrua/A5S-8.1-kernel-source
      KERNEL_BRANCH: lineageos-no-bakasu-susfs
      TOOLCHAIN_URL: https://github.com/Nickdv9/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.git
      TOOLCHAIN_BRANCH: Linaro_6.3.1
      TOOLCHAIN_DIR: prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05
      PYTHON2_URL: https://github.com/NCLnclNCL/kernel-build/releases/download/python2.7.18/python2.7.18.zip

      # Tuning.
      CCACHE_SIZE: 10G
      SYNC_JOBS: '4'
      GIT_TERMINAL_PROMPT: '0'

    steps:
      # ------------------------------------------------------ environment --
      - name: Show runner info
        run: |
          head -n 2 /etc/os-release
          echo "Cores: $(nproc --all)"
          free -h
          df -h / /cache 2>/dev/null || df -h "$GITHUB_WORKSPACE"

      - name: Write shared shell helpers
        run: |
          cat > "$RUNNER_TEMP/ci-lib.sh" <<'EOF'
          # shellcheck shell=bash
          # Shared helpers, sourced by later steps. Expects TOKEN in the environment.

          # Authenticated HTTPS URL for an "owner/repo" slug. Never print this.
          repo_url() {
            printf 'https://x-access-token:%s@github.com/%s.git' "$TOKEN" "$1"
          }

          # retry <attempts> <delay-seconds> <command...>
          retry() {
            local attempts="$1" delay="$2" n=1
            shift 2
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              echo "Attempt $n/$attempts failed, retrying in ${delay}s"
              n=$((n + 1))
              sleep "$delay"
            done
          }

          # fetch_tree <git-url> <branch> <dest>: shallow clone, then drop .git
          fetch_tree() {
            local url="$1" branch="$2" dest="$3" sha
            mkdir -p "$(dirname "$dest")"
            git clone --quiet --depth=1 --branch "$branch" "$url" "$dest"
            sha=$(git -C "$dest" rev-parse --short HEAD)
            rm -rf "$dest/.git"
            echo "Fetched $dest @ $branch ($sha)"
          }

          # start_monitor [interval-seconds] [procs]
          # Logs disk and memory in the background; stops when the step exits.
          start_monitor() {
            local interval="${1:-180}" show_procs="${2:-}"
            (
              while true; do
                echo "[monitor] $(date +%H:%M) disk: $(df -h . | awk 'END {print $3 " used, " $4 " free"}')" \
                  "| mem: $(free -m | awk '/Mem:/ {print $3 "MB used, " $7 "MB avail"}')" \
                  "| swap: $(free -m | awk '/Swap:/ {print $3 "MB used"}')"
                if [ -n "$show_procs" ]; then
                  ps -eo pid,pcpu,pmem,rss,comm --sort=-rss | sed -n '1,5p'
                fi
                sleep "$interval"
              done
            ) &
            MONITOR_PID=$!
            trap stop_monitor EXIT
          }

          stop_monitor() {
            if [ -n "${MONITOR_PID:-}" ]; then
              pkill -P "$MONITOR_PID" 2>/dev/null || true
              kill "$MONITOR_PID" 2>/dev/null || true
            fi
          }
          EOF

      - name: Validate and normalize inputs
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"

          fail() { echo "::error::$*"; exit 1; }

          normalize_repo() {
            local t
            t=$(printf '%s' "$1" | tr -d '[:space:]')
            t="${t#https://github.com/}"
            t="${t#http://github.com/}"
            t="${t%/}"
            t="${t%.git}"
            printf '%s' "${t%/}"
          }

          [[ "$BUILD_TIMEOUT_MIN" =~ ^[1-9][0-9]*$ ]] \
            || fail "build_timeout_min must be a positive whole number of minutes"
          if [ "$BUILD_TIMEOUT_MIN" -gt 600 ]; then
            echo "::warning::build_timeout_min=$BUILD_TIMEOUT_MIN leaves little of the 720-minute job limit for setup, sync and upload"
          fi

          [[ "$DEVICE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || fail "device_name may only contain letters, digits, '.', '_' and '-'"

          device_repo=$(normalize_repo "$IN_DEVICE_REPO")
          vendor_repo=$(normalize_repo "$IN_VENDOR_REPO")
          for repo in "$device_repo" "$vendor_repo"; do
            [[ "$repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] \
              || fail "Not a valid owner/repo name: $repo"
          done

          check_branch() {
            git ls-remote --exit-code --heads "$(repo_url "$1")" "refs/heads/$2" >/dev/null 2>&1 \
              || fail "Repo or branch not found (or not readable with the token): $1 @ $2"
          }
          check_branch "$device_repo" "$IN_DEVICE_BRANCH"
          check_branch "$vendor_repo" "$IN_VENDOR_BRANCH"

          {
            echo "DEVICE_REPO=$device_repo"
            echo "VENDOR_REPO=$vendor_repo"
          } >> "$GITHUB_ENV"
          echo "Inputs look good: $device_repo @ $IN_DEVICE_BRANCH, $vendor_repo @ $IN_VENDOR_BRANCH"

      - name: Prepare workspace and cache directories
        run: |
          mkdir -p "$SRC_DIR" "$RESULT_DIR"

          if [ "$OUT_ON_CACHE" = "true" ] && [ ! -d /cache ]; then
            echo "::warning::out_on_cache is enabled but /cache does not exist; using the root disk"
          fi

          if [ "$OUT_ON_CACHE" = "true" ] && [ -d /cache ]; then
            sudo mkdir -p /cache/ccache /cache/out

            # Only walk the (large) trees with chown if something isn't already ours.
            if [ -n "$(sudo find /cache/ccache /cache/out ! -user "$(id -u)" -print -quit)" ]; then
              sudo chown -R "$(id -u):$(id -g)" /cache/ccache /cache/out
            fi

            if [ "$CLEAN_OUT" = "true" ]; then
              echo "Cleaning /cache/out"
              find /cache/out -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi

            # build/make/core/Makefile recreates system/vendor -> /vendor and
            # vendor/odm -> /odm with a plain `ln -sf`. If such a symlink is left
            # over in a persistent out/, `ln -sf` follows it and tries to create
            # /vendor/vendor (or /odm/odm) at the filesystem root, which fails.
            # Remove stale links so the rules can create them fresh.
            for stale in /cache/out/target/product/*/system/vendor \
                         /cache/out/target/product/*/vendor/odm; do
              if [ -L "$stale" ]; then
                rm -f "$stale"
              fi
            done

            {
              echo "CCACHE_DIR=/cache/ccache"
              echo "OUT_BASE=/cache/out"
              echo "OUT_DIR=/cache/out"
            } >> "$GITHUB_ENV"
            echo "Using /cache for ccache and out"
          else
            mkdir -p "$GITHUB_WORKSPACE/.ccache"
            {
              echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
              echo "OUT_BASE=$SRC_DIR/out"
            } >> "$GITHUB_ENV"
            echo "Using the root disk for ccache and out"
          fi

      - name: Set up Python 2 for legacy kernel tools
        run: |
          py2_home="$RUNNER_TEMP/python2"
          shim_dir="$RUNNER_TEMP/python2-shim"

          curl -fsSL --retry 3 "$PYTHON2_URL" -o "$RUNNER_TEMP/python2.zip"
          unzip -q -o "$RUNNER_TEMP/python2.zip" -d "$RUNNER_TEMP"
          chmod +x "$py2_home"/bin/* 2>/dev/null || true
          if [ ! -x "$py2_home/bin/python" ]; then
            echo "::error::Python 2 archive did not provide python2/bin/python"
            exit 1
          fi

          # The paths are baked in so the shim works from any environment,
          # including the sanitized one the Android build runs in.
          mkdir -p "$shim_dir"
          cat > "$shim_dir/python" <<EOF
          #!/bin/sh
          export PYTHONHOME="$py2_home"
          exec "\$PYTHONHOME/bin/python" "\$@"
          EOF
          chmod +x "$shim_dir/python"

          sudo ln -sf "$shim_dir/python" /usr/bin/python
          echo "$shim_dir" >> "$GITHUB_PATH"
          /usr/bin/python -c 'import sys; print(sys.version)'

      - name: Install build dependencies
        run: |
          sudo apt-get update

          packages=(
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libncurses5-dev
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush python3
            rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev
          )

          has_candidate() {
            local candidate
            candidate=$(apt-cache policy "$1" 2>/dev/null | awk '/Candidate:/ {print $2}' || true)
            [ -n "$candidate" ] && [ "$candidate" != "(none)" ]
          }

          available=()
          for pkg in "${packages[@]}"; do
            if has_candidate "$pkg"; then
              available+=("$pkg")
            else
              echo "Not available (skipping): $pkg"
            fi
          done
          sudo apt-get install -y "${available[@]}"

          # libtinfo5 / libncurses5 were dropped from Ubuntu 24.04; pull them from 22.04.
          if ! dpkg -s libtinfo5 >/dev/null 2>&1; then
            jammy_list=/etc/apt/sources.list.d/jammy-tmp.list
            echo "deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu jammy main universe" \
              | sudo tee "$jammy_list" >/dev/null
            {
              sudo apt-get update \
                -o Dir::Etc::sourcelist="$jammy_list" \
                -o Dir::Etc::sourceparts="-" \
                -o APT::Get::List-Cleanup=0 || true
              (cd /tmp && apt-get download libtinfo5 libncurses5) \
                && sudo dpkg -i /tmp/libtinfo5_*.deb /tmp/libncurses5_*.deb
            } || echo "::warning::Could not install libtinfo5/libncurses5 from Ubuntu 22.04"
            sudo rm -f "$jammy_list"
            sudo apt-get update || true
          fi
          dpkg -s libncurses5 libtinfo5 2>/dev/null | grep -E '^(Package|Status)' || true

      - name: Install repo and configure git
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name "builder"
          git config --global user.email "builder@users.noreply.github.com"
          git config --global color.ui false
          git config --global gc.auto 0

      # ----------------------------------------------------------- sources --
      - name: Sync LineageOS 17.1 source
        working-directory: ${{ env.SRC_DIR }}
        timeout-minutes: 120
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"

          repo init -u "$LINEAGE_MANIFEST_URL" -b "$LINEAGE_BRANCH" \
            -g default,-darwin --depth=1 --no-clone-bundle

          start_monitor
          retry 4 15 repo sync -c -j"$SYNC_JOBS" -q --force-sync \
            --no-clone-bundle --no-tags --optimized-fetch \
            || { echo "::error::Source sync failed"; exit 1; }
          df -h .

      # The kernel is built from this tree (TARGET_KERNEL_SOURCE =
      # kernel/oppo/<device>). LineageOS's generated_kernel_includes Soong
      # module also runs `make -C $(TARGET_KERNEL_SOURCE) headers_install` for
      # modules that depend on generated_kernel_headers, so it must be in place
      # before the build starts.
      - name: Fetch device, vendor and kernel trees
        working-directory: ${{ env.SRC_DIR }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"

          fetch_tree "$(repo_url "$DEVICE_REPO")" "$IN_DEVICE_BRANCH" "device/oppo/$DEVICE"
          fetch_tree "$(repo_url "$VENDOR_REPO")" "$IN_VENDOR_BRANCH" "vendor/oppo/$DEVICE"
          fetch_tree "$(repo_url "$KERNEL_REPO")" "$KERNEL_BRANCH" "kernel/oppo/$DEVICE"

          ls -A "device/oppo/$DEVICE" | sed -n '1,60p'
          ls -A "vendor/oppo/$DEVICE" | sed -n '1,40p'
          if [ ! -f "device/oppo/$DEVICE/lineage_$DEVICE.mk" ]; then
            echo "::warning::lineage_$DEVICE.mk not found in the device tree; lunch may fail"
          fi

      - name: Keep kernel warnings non-fatal
        working-directory: ${{ env.SRC_DIR }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          makefile = Path("kernel/oppo") / os.environ["DEVICE"] / "scripts" / "Makefile.lib"
          needle = "$(ccflags-y) $(CFLAGS_$(basetarget).o)"

          text = makefile.read_text()
          if text.count(needle) != 1:
              raise SystemExit(f"Expected exactly one occurrence of the Kbuild C flags in {makefile}")

          makefile.write_text(text.replace(needle, needle + " -Wno-error", 1))
          print(f"Patched {makefile}")
          PY

      - name: Add AArch64 GCC toolchain
        working-directory: ${{ env.SRC_DIR }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"

          fetch_tree "$TOOLCHAIN_URL" "$TOOLCHAIN_BRANCH" "$TOOLCHAIN_DIR"
          test -x "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc"
          "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc" --version | sed -n '1p'

      - name: Verify Git LFS artifacts
        working-directory: ${{ env.SRC_DIR }}
        run: |
          apk_dir=external/chromium-webview/prebuilt/arm64
          apk="$apk_dir/webview.apk"

          is_apk() { [ "$(head -c 2 "$1")" = "PK" ]; }

          if [ ! -e "$apk_dir/.git" ]; then
            echo "::error::$apk_dir is not checked out; the external/chromium-webview prebuilts are in the pdk group and must be fetched by repo sync"
            exit 1
          fi

          echo "webview.apk size before: $(stat -c '%s' "$apk") bytes"
          if is_apk "$apk"; then
            echo "webview.apk is already a real APK"
          else
            echo "webview.apk is not a ZIP/APK (likely an LFS pointer); running git lfs pull"
            git -C "$apk_dir" lfs pull
            echo "webview.apk size after: $(stat -c '%s' "$apk") bytes"
          fi

          if ! is_apk "$apk"; then
            echo "::error::webview.apk is still not a ZIP/APK after git lfs pull"
            exit 1
          fi

      # ------------------------------------------------------------- build --
      - name: Build
        working-directory: ${{ env.SRC_DIR }}
        env:
          LC_ALL: C
          USE_CCACHE: '1'
          ALLOW_MISSING_DEPENDENCIES: 'true'
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"

          CCACHE_EXEC=$(command -v ccache)
          JOBS=$(nproc --all)
          export CCACHE_EXEC JOBS

          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_SIZE"
          ccache --zero-stats

          echo "cores=$JOBS OUT_DIR=${OUT_DIR:-<default>} CCACHE_DIR=$CCACHE_DIR"
          free -h
          start_monitor 180 procs

          # The step must outlive a failing build so the status can be reported
          # below; the log is tee'd so the tail can go into the artifact.
          set +e
          timeout --kill-after=2m "${BUILD_TIMEOUT_MIN}m" bash -c '
            set -o pipefail
            source build/envsetup.sh
            lunch "lineage_${DEVICE}-${BTYPE}" || exit 1
            mka "${TARGET}" -j"${JOBS}"
          ' 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          set -e

          ccache --show-stats | sed -n '1,15p' || true

          case "$rc" in
            0)
              echo "Build finished successfully"
              ;;
            124|137)
              echo "::error::Build timed out after ${BUILD_TIMEOUT_MIN} minutes (exit code $rc)"
              ;;
            *)
              echo "::error::Build failed with exit code $rc; see build-tail.log and error.log in the artifact"
              ;;
          esac
          exit "$rc"

      # ----------------------------------------------------------- results --
      - name: Diagnostics on failure
        if: failure()
        run: |
          df -h || true
          free -h || true
          echo "=== possible OOM kills ==="
          sudo dmesg -T | grep -Ei 'killed process|out of memory|oom-kill|invoked oom-killer' | tail -n 40 || true
          echo "=== recent kernel messages ==="
          sudo dmesg -T | tail -n 40 || true

      - name: Collect output
        if: always()
        run: |
          shopt -s nullglob

          OUT_BASE="${OUT_BASE:-$SRC_DIR/out}"
          product_out="$OUT_BASE/target/product/$DEVICE"
          mkdir -p "$RESULT_DIR"

          candidates=()
          for img in boot recovery dtbo vbmeta system vendor product; do
            candidates+=("$product_out/$img.img")
          done
          candidates+=("$product_out"/lineage-*.zip "$product_out"/lineage-*.zip.sha256sum)

          for f in "${candidates[@]}"; do
            if [ -f "$f" ]; then
              cp -v "$f" "$RESULT_DIR/"
            fi
          done

          # Zero-byte files are useless to upload and can be rejected, so only
          # keep error.log when it has content.
          if [ -s "$OUT_BASE/error.log" ]; then
            cp -v "$OUT_BASE/error.log" "$RESULT_DIR/"
          fi

          if [ -f "$RUNNER_TEMP/build.log" ]; then
            tail -n 3000 "$RUNNER_TEMP/build.log" > "$RESULT_DIR/build-tail.log"
          fi

          ls -lh "$RESULT_DIR"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-17.1-${{ inputs.device_name }}-${{ inputs.target }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 7
