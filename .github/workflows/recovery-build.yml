name: Build TWRP Recovery

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'Minimal TWRP manifest branch'
        required: true
        default: 'twrp-9.0'
        type: choice
        options:
          - 'twrp-9.0'
          - 'twrp-8.1'
      build_type:
        description: 'Android build variant'
        required: true
        default: 'eng'
        type: choice
        options:
          - 'eng'
          - 'userdebug'
          - 'user'
      device_branch:
        description: 'Device tree branch to build'
        required: true
        default: 'recovery'
        type: string
      create_release:
        description: 'Create a GitHub Release with the build artifacts'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Recovery Image
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.device_branch || github.ref_name }}
          path: device_tree

      - name: Free Runner Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5-dev libncurses-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2 libxml2-utils \
            xsltproc unzip fontconfig rsync bc lzip libssl-dev \
            python-is-python3
          sudo apt-get install -y libncurses5 || true

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Initialize & Sync Minimal TWRP Manifest
        run: |
          mkdir -p $HOME/work
          cd $HOME/work
          MANIFEST_BRANCH="${{ inputs.manifest_branch || 'twrp-9.0' }}"
          echo "Initializing repo with branch: ${MANIFEST_BRANCH}"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b "${MANIFEST_BRANCH}" --depth=1
          repo sync -c --no-clone-bundle --no-tags -j$(nproc --all)

      - name: Inject Device Tree
        run: |
          TARGET_DIR="$HOME/work/device/oppo/CPH1909"
          mkdir -p "${TARGET_DIR}"
          rsync -av --exclude='.git' --exclude='tmp' "${GITHUB_WORKSPACE}/device_tree/" "${TARGET_DIR}/"

      - name: Build TWRP Recovery Image
        run: |
          cd $HOME/work
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          BUILD_TYPE="${{ inputs.build_type || 'eng' }}"
          lunch "omni_CPH1909-${BUILD_TYPE}"
          mka recoveryimage -j$(nproc --all)

      - name: Prepare Output Artifacts
        run: |
          OUT_DIR="$HOME/work/out/target/product/CPH1909"
          mkdir -p "${GITHUB_WORKSPACE}/output"
          if [ -f "${OUT_DIR}/recovery.img" ]; then
            cp "${OUT_DIR}/recovery.img" "${GITHUB_WORKSPACE}/output/recovery.img"
            cd "${GITHUB_WORKSPACE}/output"
            sha256sum recovery.img > recovery.img.sha256
            md5sum recovery.img > recovery.img.md5
            echo "Artifacts prepared successfully:"
            ls -lh "${GITHUB_WORKSPACE}/output"
          else
            echo "::error::recovery.img not found in ${OUT_DIR}"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-recovery-CPH1909
          path: output/
          retention-days: 14

      - name: Set Release Metadata
        if: ${{ inputs.create_release == true || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "RELEASE_TITLE=TWRP Recovery for OPPO A5s (CPH1909) ${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
            echo "RELEASE_TITLE=TWRP Recovery Build #${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        if: ${{ inputs.create_release == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/recovery.img
            output/recovery.img.sha256
            output/recovery.img.md5
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### Automated TWRP Recovery Build for OPPO A5s / AX5s (`CPH1909`)
            - Platform: MediaTek MT6765 (`oppo6765_18511`)
            - Build Variant: ${{ inputs.build_type || 'eng' }}
            - Manifest: ${{ inputs.manifest_branch || 'twrp-9.0' }}
            - Commit: ${{ github.sha }}
